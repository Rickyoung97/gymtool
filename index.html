<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Fitness Tracker Pro — Full Body A, B & Custom</title>
<style>
:root{--bg:#0b0d10;--card:#151920;--card2:#1b2028;--text:#f4f6f8;--muted:#9ca5b1;--accent:#d8ad55;--line:#2b313b;--ok:#6bc48b;--danger:#e36d6d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:auto;padding:18px 14px 50px}.hero{padding:8px 2px 18px}.hero h1{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:8px 0 14px;overflow-x:auto;padding-bottom:4px}.tab{flex:1;min-width:100px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;text-align:center}.tab.active{background:var(--accent);color:#111;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}.toolbar,.history-card,.exercise,.card-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.input,select,textarea{width:100%;background:#0f1217;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.exercise h3{margin:0;font-size:18px}.exercise .meta{color:var(--muted);font-size:13px;margin:3px 0}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.visual{color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap;padding:4px 8px;border-radius:6px;background:rgba(216,173,85,0.1);border:1px solid rgba(216,173,85,0.2);transition:all .2s}.visual:hover{background:rgba(216,173,85,0.25)}

/* Radio button varianten */
.options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.radio-lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;background:#0f1217;padding:6px 12px;border-radius:99px;border:1px solid var(--line);transition:all .2s}
.radio-lbl:has(input:checked){border-color:var(--accent);color:var(--accent);background:rgba(216, 173, 85, 0.1)}
input[type="radio"]{accent-color:var(--accent);margin:0;cursor:pointer}

.sets{display:grid;gap:8px}.setrow{display:grid;grid-template-columns:50px 1fr 1fr;gap:8px;align-items:center}.setnum{color:var(--muted);font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;transition:all .2s}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}.btn.danger{color:#ff9b9b;border-color:rgba(255,155,155,0.2);background:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.small{font-size:12px;color:var(--muted)}.history-card h3{margin:0 0 6px}.history-card .row{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#242b35;color:#dbe0e6;font-size:12px}.empty{text-align:center;color:var(--muted);padding:20px}.section-title{margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:flex-end}

/* Edit banner & Reminders */
.edit-banner{background:rgba(216,173,85,0.15);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:none}
.edit-notice{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--accent)}
.reminder-box{background:rgba(107, 196, 139, 0.1);border:1px solid rgba(107, 196, 139, 0.3);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--ok)}
.prev-stats-box{background:#0f1217;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:var(--muted)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:400px;width:90%;text-align:center}

@media(max-width:560px){.grid{grid-template-columns:1fr}.setrow{grid-template-columns:45px 1fr 1fr}.hero h1{font-size:24px}.edit-notice{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🏋️ Fitness Tracker Pro</h1>
    <p>Bibliotheek · Reminders · Visualisaties · Custom Workouts</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="A">Full Body A</button>
    <button class="tab" data-tab="B">Full Body B</button>
    <button class="tab" data-tab="CUSTOM">Custom</button>
    <button class="tab" data-tab="library">📚 Bibliotheek</button>
    <button class="tab" data-tab="history">📊 Historie & Grafieken</button>
    <button class="tab" data-tab="settings">⚙️ Instellingen</button>
  </div>

  <section id="A" class="panel active"></section>
  <section id="B" class="panel"></section>
  <section id="CUSTOM" class="panel"></section>
  <section id="library" class="panel"></section>
  <section id="history" class="panel"></section>
  <section id="settings" class="panel"></section>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="custom-modal">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-top:0">Weet u het zeker?</h3>
    <p id="modal-msg" style="color:var(--muted); font-size:14px">Alle ingevulde gegevens in dit scherm worden gewist.</p>
    <div class="actions" style="justify-content:center; margin-top:18px">
      <button class="btn danger" id="modal-confirm-btn">Ja, wissen</button>
      <button class="btn" onclick="closeModal()">Annuleren</button>
    </div>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Standaard Bibliotheek
const DEFAULT_LIB = [
  {id: "ex_1", name: "Leg press", cat: "Benen", guideline: "3×8–12", variants: ["Standaard","Voeten hoog","Voeten laag","Breed","Smal","Unilateraal"]},
  {id: "ex_2", name: "Chest press", cat: "Borst", guideline: "3×8–12", variants: ["Machine","Dumbbells","Barbell","Smith-machine"]},
  {id: "ex_3", name: "Lat pulldown", cat: "Rug", guideline: "3×8–12", variants: ["Brede greep","Smalle V-greep","Onderhands (Supinatie)"]},
  {id: "ex_4", name: "Seated shoulder press", cat: "Schouders", guideline: "2×8–12", variants: ["Dumbbells","Machine","Smith-machine"]},
  {id: "ex_5", name: "Leg curl", cat: "Hamstrings", guideline: "2×10–15", variants: ["Zittend","Liggend","Staand"]},
  {id: "ex_6", name: "Cable triceps pushdown", cat: "Triceps", guideline: "2×10–15", variants: ["Touw","Rechte stang","V-bar","EZ-stang"]},
  {id: "ex_7", name: "Cable biceps curl", cat: "Biceps", guideline: "2×10–15", variants: ["Rechte stang","Touw (Hammer)","EZ-stang","Losse handgrepen"]},
  {id: "ex_8", name: "Goblet squat", cat: "Benen", guideline: "3×8–12", variants: ["Dumbbell","Kettlebell","Met hielverhoging"]},
  {id: "ex_9", name: "Incline chest press", cat: "Borst", guideline: "3×8–12", variants: ["Dumbbells","Barbell","Machine"]},
  {id: "ex_10", name: "Seated cable row", cat: "Rug", guideline: "3×8–12", variants: ["Brede stang","Smalle V-greep","Unilateraal"]},
  {id: "ex_11", name: "Lateral raise", cat: "Schouders", guideline: "2×10–15", variants: ["Dumbbells (Staand)","Dumbbells (Zittend)","Kabels"]},
  {id: "ex_12", name: "Romanian deadlift", cat: "Hamstrings/glutes", guideline: "2×8–12", variants: ["Barbell","Dumbbells","Single-leg (Unilateraal)"]},
  {id: "ex_13", name: "Cable triceps extension", cat: "Triceps", guideline: "2×10–15", variants: ["Overhead (Touw)","Pushdown (Stang)","Unilateraal (Kabel)"]},
  {id: "ex_14", name: "Hammer curl", cat: "Biceps", guideline: "2×10–15", variants: ["Dumbbells (Tegelijk)","Dumbbells (Om en om)","Touw (Kabel)"]}
];

const DEFAULT_PLANS = {
  A: ["ex_1", "ex_2", "ex_3", "ex_4", "ex_5", "ex_6", "ex_7"],
  B: ["ex_8", "ex_9", "ex_10", "ex_11", "ex_12", "ex_13", "ex_14"],
  CUSTOM: []
};

const KEY_HIST = "fitnessTrackerV2_History";
const KEY_LIB = "fitnessTrackerV2_Library";
const KEY_PLANS = "fitnessTrackerV2_Plans";
const DRAFT_KEY = "fitnessDraft_";

let current = "A";
let editingIndex = null;
let chartInstance = null;
let pendingConfirmAction = null;

// Initialisatie Opslag
function getLibrary(){ return JSON.parse(localStorage.getItem(KEY_LIB)) || DEFAULT_LIB; }
function saveLibrary(lib){ localStorage.setItem(KEY_LIB, JSON.stringify(lib)); }
function getPlans(){ return JSON.parse(localStorage.getItem(KEY_PLANS)) || DEFAULT_PLANS; }
function savePlans(p){ localStorage.setItem(KEY_PLANS, JSON.stringify(p)); }
function loadHistory(){ return JSON.parse(localStorage.getItem(KEY_HIST) || "[]"); }
function saveHistory(h){ localStorage.setItem(KEY_HIST, JSON.stringify(h)); }

const today = () => new Date().toISOString().slice(0,10);

function getSearchUrl(exName, variant){
  let query = exName;
  if(variant && variant !== "Standaard") query += " " + variant;
  query += " exercise";
  return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
}

// Modal functionaliteit
function openModal(msg, onConfirm){
  document.getElementById("modal-msg").innerText = msg;
  pendingConfirmAction = onConfirm;
  document.getElementById("custom-modal").classList.add("active");
}
function closeModal(){
  document.getElementById("custom-modal").classList.remove("active");
  pendingConfirmAction = null;
}
document.getElementById("modal-confirm-btn").onclick = () => {
  if(pendingConfirmAction) pendingConfirmAction();
  closeModal();
};

// Event Listeners voor Auto-save & Dynamische UI
document.addEventListener("input", e => { 
  const p = e.target.closest(".panel"); 
  if(p && (p.id==="A"||p.id==="B"||p.id==="CUSTOM")) saveDraft(p.id); 
});

document.addEventListener("change", e => { 
  if(e.target.type === "radio") {
    const card = e.target.closest(".exercise");
    if(card) {
      const panel = card.closest(".panel");
      if(panel && (panel.id==="A"||panel.id==="B"||panel.id==="CUSTOM")) {
        updateExerciseCardDynamicData(card, panel.id);
      }
    }
  }
  const p = e.target.closest(".panel"); 
  if(p && (p.id==="A"||p.id==="B"||p.id==="CUSTOM")) saveDraft(p.id); 
});

function switchTab(tabName){
  document.querySelectorAll(".tab").forEach(x => {
    if(x.dataset.tab === tabName) x.classList.add("active");
    else x.classList.remove("active");
  });
  document.querySelectorAll(".panel").forEach(x => {
    if(x.id === tabName) x.classList.add("active");
    else x.classList.remove("active");
  });
  current = tabName;
  if(current === "history") renderHistory();
  else if(current === "library") renderLibrary();
  else if(current === "settings") renderSettings();
}

function renderPlan(type){
 const p = document.getElementById(type);
 const plans = getPlans();
 const library = getLibrary();
 const exIds = plans[type] || [];
 
 const titleMap = { A: "Full Body A", B: "Full Body B", CUSTOM: "Custom Training" };

 p.innerHTML = `
 <div id="${type}-edit-banner" class="edit-banner"></div>
 <div class="toolbar">
   <div class="grid">
    <div><label>Datum training</label><input class="input" id="${type}-date" type="date" value="${today()}"></div>
    <div><label>Treadmill warming-up (minuten)</label><input class="input" id="${type}-run" type="number" inputmode="decimal" min="0" step="0.5" value="10"></div>
   </div>
   <div style="margin-top:10px"><label>Algemene notities</label><textarea id="${type}-notes" placeholder="Bijv. energie, bijzonderheden, techniek..."></textarea></div>
 </div>
 <div class="section-title">
    <h2 style="margin:0">${titleMap[type]}</h2>
    <div class="small">Auto-save actief 💾</div>
 </div>
 <div id="${type}-exercises"></div>
 
 <div class="card-box" style="margin-top:15px; border-style:dashed;">
    <h4 style="margin:0 0 8px">+ Oefening toevoegen aan ${titleMap[type]}</h4>
    <div style="display:flex; gap:8px">
      <select id="${type}-add-select" class="input">
        <option value="">-- Kies uit bibliotheek --</option>
        ${library.map(e => `<option value="${e.id}">${e.name} (${e.cat})</option>`).join('')}
      </select>
      <button class="btn primary small" style="white-space:nowrap" onclick="addExerciseToPlan('${type}')">Toevoegen</button>
    </div>
 </div>

 <div class="actions">
    <button class="btn primary" id="${type}-submit-btn" onclick="finish('${type}')">✓ Training opslaan</button>
    <button class="btn danger" onclick="confirmResetForm('${type}')">Formulier & concept wissen</button>
 </div>`;
 
 const box = document.getElementById(type+"-exercises");
 exIds.forEach((exId, i) => {
   const exObj = library.find(l => l.id === exId);
   if(exObj) box.insertAdjacentHTML("beforeend", exerciseHTML(type, exObj, i));
 });

 // Update dynamische data (vorige history & reminders)
 document.querySelectorAll(`#${type}-exercises .exercise`).forEach(card => {
   updateExerciseCardDynamicData(card, type);
 });
 
 if(editingIndex !== null) {
   const h = loadHistory();
   if(h[editingIndex] && h[editingIndex].type === type) {
     populateFormWithData(type, h[editingIndex]);
     showEditBanner(type, h[editingIndex].date);
     return;
   }
 }
 
 restoreDraft(type);
}

function exerciseHTML(type, e, i){
 const defaultVariant = e.variants && e.variants.length > 0 ? e.variants[0] : "Standaard";
 const initialSearchUrl = getSearchUrl(e.name, defaultVariant);

 let optionsHTML = "";
 if(e.variants && e.variants.length > 0) {
   optionsHTML = `<div class="options">` + e.variants.map((opt, oIdx) => 
     `<label class="radio-lbl"><input type="radio" name="${type}-var-${i}" value="${opt}" ${oIdx===0?'checked':''}> ${opt}</label>`
   ).join("") + `</div>`;
 }

 return `<div class="exercise" data-ex-id="${e.id}" data-ex-name="${escapeHTML(e.name)}" data-ex-idx="${i}">
  <div class="exhead">
    <div>
      <h3>${i+1}. ${escapeHTML(e.name)}</h3>
      <div class="meta">${escapeHTML(e.cat)} · richtlijn ${escapeHTML(e.guideline||'3x8-12')}</div>
    </div>
    <div style="display:flex; gap:6px; align-items:center">
      <a class="visual" href="${initialSearchUrl}" target="_blank" rel="noopener">📷 Google</a>
      <button class="btn danger small" style="padding:2px 6px" onclick="removeExerciseFromPlan('${type}', ${i})" title="Verwijderen uit dit schema">✕</button>
    </div>
  </div>
  ${optionsHTML}
  
  <div class="prev-stats-box" id="${type}-prev-${i}">Nog geen eerdere gegevens voor deze variant.</div>
  <div class="reminder-box" id="${type}-reminder-${i}" style="display:none"></div>

  <div class="sets" id="${type}-sets-${i}">${setHTML(0)}${setHTML(1)}</div>
  <div class="actions">
    <button class="btn small" onclick="addSet('${type}',${i})">＋ Set toevoegen</button>
    <button class="btn danger small" onclick="removeSet('${type}',${i})">− Laatste set</button>
  </div>
  
  <div style="margin-top:10px">
    <label>Extra opmerking / Reminder voor volgende keer (per variant)</label>
    <input class="input extra-note" type="text" placeholder="Bijv. Vorig gewicht ging te licht, volgende keer +2.5kg">
  </div>
 </div>`;
}

function updateExerciseCardDynamicData(card, type){
  const exName = card.dataset.exName;
  const checkedRadio = card.querySelector(`input[type="radio"]:checked`);
  const variant = checkedRadio ? checkedRadio.value : "Standaard";
  
  // Update Visual Link
  const visualLink = card.querySelector(".visual");
  if(visualLink) visualLink.href = getSearchUrl(exName, variant);

  // Zoek geschiedenis voor deze specifieke oefening + variant
  const history = loadHistory();
  let prevSetText = "Geen eerdere gegevens voor deze variant.";
  let prevReminder = "";

  for(let train of history){
    let match = train.exercises.find(e => e.name === exName && (e.variant === variant || (!e.variant && variant === "Standaard")));
    if(match){
      if(match.sets && match.sets.length > 0){
        let setStrs = match.sets.filter(s => s.kg || s.reps).map(s => `${s.kg||0}kg × ${s.reps||0}`);
        if(setStrs.length > 0) prevSetText = `Vorige keer (${train.date}): ${setStrs.join(', ')}`;
      }
      if(match.extraNote && match.extraNote.trim() !== ""){
        prevReminder = match.extraNote;
      }
      break; 
    }
  }

  const idx = card.dataset.exIdx;
  const prevBox = document.getElementById(`${type}-prev-${idx}`);
  if(prevBox) prevBox.innerText = prevSetText;

  const remBox = document.getElementById(`${type}-reminder-${idx}`);
  if(remBox){
    if(prevReminder !== ""){
      remBox.style.display = "block";
      remBox.innerHTML = `💡 <strong>Reminder vorige keer:</strong> ${escapeHTML(prevReminder)}`;
    } else {
      remBox.style.display = "none";
      remBox.innerHTML = "";
    }
  }
}

function setHTML(n){return `<div class="setrow"><div class="setnum">Set ${n+1}</div><input class="input kg" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg"><input class="input reps" type="number" inputmode="numeric" min="0" step="1" placeholder="reps"></div>`}

function addSet(t,i){
    document.getElementById(`${t}-sets-${i}`).insertAdjacentHTML("beforeend",setHTML(document.getElementById(`${t}-sets-${i}`).children.length));
    saveDraft(t);
}

function removeSet(t,i){
    let b=document.getElementById(`${t}-sets-${i}`);
    if(b.children.length>1) { b.lastElementChild.remove(); saveDraft(t); }
}

function addExerciseToPlan(t){
  const select = document.getElementById(`${t}-add-select`);
  const exId = select.value;
  if(!exId) return;
  const plans = getPlans();
  plans[t].push(exId);
  savePlans(plans);
  renderPlan(t);
}

function removeExerciseFromPlan(t, index){
  const plans = getPlans();
  plans[t].splice(index, 1);
  savePlans(plans);
  renderPlan(t);
}

function collect(t, isDraft=false){
 const library = getLibrary();
 const out={type:t, date:document.getElementById(t+"-date").value, run:document.getElementById(t+"-run").value, notes:document.getElementById(t+"-notes").value, exercises:[]};
 
 document.querySelectorAll(`#${t}-exercises .exercise`).forEach((card,i)=>{
  let exName = card.dataset.exName;
  let variant = "";
  const checkedRadio = card.querySelector(`input[type="radio"]:checked`);
  if(checkedRadio) variant = checkedRadio.value;

  let extraNote = card.querySelector(".extra-note").value;
  let sets = [...card.querySelectorAll(".setrow")].map((r,j)=>({set:j+1,kg:r.querySelector(".kg").value,reps:r.querySelector(".reps").value}));
  if(!isDraft) sets = sets.filter(s=>s.kg!==""||s.reps!=="");
  
  out.exercises.push({name:exName, variant, sets, extraNote});
 });
 return out;
}

function saveDraft(t){ 
  if(editingIndex === null) {
    localStorage.setItem(DRAFT_KEY+t, JSON.stringify(collect(t, true))); 
  }
}

function restoreDraft(t){
 const draft = JSON.parse(localStorage.getItem(DRAFT_KEY+t));
 if(!draft) return;
 populateFormWithData(t, draft);
}

function populateFormWithData(t, data){
 document.getElementById(t+"-date").value = data.date || today();
 document.getElementById(t+"-run").value = data.run !== undefined ? data.run : "10";
 document.getElementById(t+"-notes").value = data.notes || "";
 
 document.querySelectorAll(`#${t}-exercises .exercise`).forEach((card, i) => {
   const exData = data.exercises[i];
   if(exData){
     if(exData.variant) {
        const r = card.querySelector(`input[type="radio"][value="${exData.variant}"]`);
        if(r) r.checked = true;
     }
     if(exData.extraNote) {
        card.querySelector(".extra-note").value = exData.extraNote;
     }
     const container = document.getElementById(`${t}-sets-${i}`);
     if(container) {
       container.innerHTML = "";
       const setsToLoad = (exData.sets && exData.sets.length > 0) ? exData.sets : [{kg:"", reps:""}, {kg:"", reps:""}];
       setsToLoad.forEach((s, j) => {
           container.insertAdjacentHTML("beforeend", setHTML(j));
           const row = container.children[j];
           row.querySelector(".kg").value = s.kg || "";
           row.querySelector(".reps").value = s.reps || "";
       });
     }
     updateExerciseCardDynamicData(card, t);
   }
 });
}

function showEditBanner(t, date){
 const banner = document.getElementById(`${t}-edit-banner`);
 if(banner) {
   banner.style.display = "block";
   banner.innerHTML = `
     <div class="edit-notice">
       <span>✏️ <strong>Je bewerkt nu een eerdere training</strong> van <strong>${date}</strong></span>
       <button class="btn small danger" onclick="cancelEdit('${t}')">Bewerken annuleren</button>
     </div>
   `;
 }
 const btn = document.getElementById(`${t}-submit-btn`);
 if(btn) btn.innerHTML = "✓ Wijzigingen opslaan";
}

function cancelEdit(t){
 editingIndex = null;
 renderPlan(t);
}

function confirmResetForm(t){
 openModal("Weet u het zeker dat u het formulier wilt wissen?", () => {
  editingIndex = null;
  localStorage.removeItem(DRAFT_KEY+t);
  renderPlan(t);
 });
}

function finish(t){
 const d = collect(t, false);
 if(!d.date){alert("Vul eerst een datum in.");return}
 let h = loadHistory();

 if(editingIndex !== null && editingIndex < h.length) {
   h[editingIndex] = d;
   saveHistory(h);
   editingIndex = null;
   localStorage.removeItem(DRAFT_KEY+t);
   alert("Bewerking succesvol opgeslagen!");
 } else {
   h.unshift(d);
   saveHistory(h);
   localStorage.removeItem(DRAFT_KEY+t);
   alert("Training opgeslagen!");
 }

 renderPlan(t);
}

// ------------------- BIBLIOTHEEK TAB -------------------
function renderLibrary(){
  const p = document.getElementById("library");
  const lib = getLibrary();
  
  p.innerHTML = `
  <div class="toolbar">
    <h2 style="margin:0 0 10px">Oefeningen Bibliotheek</h2>
    <p class="small" style="margin:0 0 14px">Beheer hier alle beschikbare oefeningen en varianten.</p>
    
    <div class="card-box" style="background:#0f1217">
      <h4 style="margin:0 0 10px">Nieuwe Oefening Toevoegen</h4>
      <div class="grid">
        <input class="input" id="lib-new-name" placeholder="Naam (bijv. Bench Press)">
        <input class="input" id="lib-new-cat" placeholder="Categorie (bijv. Borst)">
        <input class="input" id="lib-new-guide" placeholder="Richtlijn (bijv. 3×8–12)">
        <input class="input" id="lib-new-vars" placeholder="Varianten (kommagescheiden: Barbell, Dumbbell)">
      </div>
      <button class="btn primary small" style="margin-top:10px" onclick="addLibraryItem()">+ Oefening Opslaan</button>
    </div>
  </div>

  <div id="lib-list"></div>`;

  const list = document.getElementById("lib-list");
  lib.forEach((item, idx) => {
    list.innerHTML += `
    <div class="history-card">
      <div class="row">
        <h3>${escapeHTML(item.name)}</h3>
        <span class="badge">${escapeHTML(item.cat)}</span>
      </div>
      <div class="small" style="margin:6px 0">Richtlijn: ${escapeHTML(item.guideline||'-')}</div>
      <div class="small" style="color:var(--accent)">Varianten: ${item.variants.map(v=>escapeHTML(v)).join(', ')}</div>
      
      <div style="margin-top:10px; display:flex; gap:8px">
        <input class="input" id="lib-var-add-${idx}" placeholder="Nieuwe variant toevoegen..." style="padding:6px 10px; font-size:12px">
        <button class="btn small" onclick="addVariantToItem(${idx})">+ Variant</button>
        <button class="btn danger small" onclick="deleteLibraryItem(${idx})">Verwijderen</button>
      </div>
    </div>`;
  });
}

function addLibraryItem(){
  const name = document.getElementById("lib-new-name").value.trim();
  const cat = document.getElementById("lib-new-cat").value.trim() || "Algemeen";
  const guide = document.getElementById("lib-new-guide").value.trim() || "3×8–12";
  const varsRaw = document.getElementById("lib-new-vars").value.trim();
  
  if(!name) return alert("Vul minimaal een naam in.");
  const variants = varsRaw ? varsRaw.split(',').map(s=>s.trim()).filter(Boolean) : ["Standaard"];

  const lib = getLibrary();
  lib.push({ id: "ex_" + Date.now(), name, cat, guideline: guide, variants });
  saveLibrary(lib);
  renderLibrary();
}

function addVariantToItem(idx){
  const input = document.getElementById(`lib-var-add-${idx}`);
  const val = input.value.trim();
  if(!val) return;
  const lib = getLibrary();
  if(!lib[idx].variants.includes(val)) lib[idx].variants.push(val);
  saveLibrary(lib);
  renderLibrary();
}

function deleteLibraryItem(idx){
  openModal("Weet u zeker dat u deze oefening uit de bibliotheek wilt verwijderen?", () => {
    const lib = getLibrary();
    lib.splice(idx, 1);
    saveLibrary(lib);
    renderLibrary();
  });
}

// ------------------- HISTORIE & GRAFIEKEN TAB -------------------
function renderHistory(){
  const p = document.getElementById("history");
  const h = loadHistory();
  const lib = getLibrary();

  // Bouw unieke lijst van oefening+variant combinaties die voorkomen in historie
  let options = [];
  h.forEach(t => t.exercises.forEach(e => {
    let v = e.variant || "Standaard";
    let key = `${e.name} (${v})`;
    if(!options.includes(key)) options.push(key);
  }));

  p.innerHTML = `
  <div class="toolbar">
    <h2 style="margin:0 0 6px">Geschiedenis & Progressie Grafiek</h2>
    <label>Selecteer oefening & variant om progressie te bekijken:</label>
    <select class="input" id="chart-ex-select" onchange="updateChartAndTable()">
      ${options.length === 0 ? '<option>Geen data beschikbaar</option>' : options.map(o => `<option value="${escapeHTML(o)}">${escapeHTML(o)}</option>`).join('')}
    </select>
  </div>

  <div class="card-box" style="position:relative; height:300px; margin-bottom:14px">
    <canvas id="progressChart"></canvas>
  </div>

  <div id="chart-history-table"></div>

  <div class="section-title"><h3 style="margin:0">Alle opgeslagen trainingen</h3></div>
  <div id="full-history-list"></div>`;

  if(options.length > 0) updateChartAndTable();
  renderFullHistoryList();
}

function updateChartAndTable(){
  const selVal = document.getElementById("chart-ex-select").value;
  if(!selVal) return;

  const h = loadHistory().reverse(); // Chronologische volgorde voor de grafiek
  const dates = [];
  const maxWeights = [];
  const tableRows = [];

  h.forEach(t => {
    t.exercises.forEach(e => {
      let v = e.variant || "Standaard";
      let key = `${e.name} (${v})`;
      if(key === selVal && e.sets && e.sets.length > 0){
        let validSets = e.sets.filter(s => s.kg !== "" || s.reps !== "");
        if(validSets.length > 0){
          let maxKg = Math.max(...validSets.map(s => parseFloat(s.kg)||0));
          dates.push(t.date);
          maxWeights.push(maxKg);
          
          let setStr = validSets.map(s => `${s.kg||0}kg × ${s.reps||0}`).join(', ');
          tableRows.push({ date: t.date, sets: setStr, note: e.extraNote || '-' });
        }
      }
    });
  });

  // Render Chart
  const ctx = document.getElementById('progressChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        label: 'Max Gewicht (kg)',
        data: maxWeights,
        borderColor: '#d8ad55',
        backgroundColor: 'rgba(216, 173, 85, 0.2)',
        fill: true,
        tension: 0.2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { grid: { color: '#2b313b' }, ticks: { color: '#9ca5b1' } },
        x: { grid: { color: '#2b313b' }, ticks: { color: '#9ca5b1' } }
      },
      plugins: { legend: { labels: { color: '#f4f6f8' } } }
    }
  });

  // Render Historie Tabel voor de oefening
  const tableContainer = document.getElementById("chart-history-table");
  if(tableRows.length === 0){
    tableContainer.innerHTML = '<div class="empty">Geen gedetailleerde sets gevonden voor deze selectie.</div>';
  } else {
    let html = `<div class="history-card"><h4 style="margin:0 0 8px">Geschiedenis voor ${escapeHTML(selVal)}</h4><table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">`;
    html += `<tr style="border-bottom:1px solid var(--line); color:var(--muted)"><th>Datum</th><th>Sets</th><th>Reminder / Opmerking</th></tr>`;
    tableRows.reverse().forEach(r => {
      html += `<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 0">${r.date}</td><td>${escapeHTML(r.sets)}</td><td>${escapeHTML(r.note)}</td></tr>`;
    });
    html += `</table></div>`;
    tableContainer.innerHTML = html;
  }
}

function renderFullHistoryList(){
 const container = document.getElementById("full-history-list");
 const h = loadHistory();
 if(!h.length){container.innerHTML = `<div class="history-card empty">Nog geen trainingen opgeslagen.</div>`;return}
 container.innerHTML = "";
 h.forEach((x,idx)=>{
   let total = x.exercises.reduce((a,e)=>a+(e.sets?e.sets.length:0),0);
   let exSummary = x.exercises.filter(e => e.sets && e.sets.length > 0).map(e => {
     let vText = e.variant ? ` (${e.variant})` : "";
     return `• ${escapeHTML(e.name)}${escapeHTML(vText)}: ${e.sets.length} set(s)`;
   }).join("<br>");

   container.innerHTML += `
   <div class="history-card">
     <div class="row">
       <h3>${x.date}</h3>
       <span class="badge">${x.type === 'CUSTOM' ? 'Custom Training' : 'Full Body ' + x.type}</span>
     </div>
     <div class="small" style="margin-bottom:8px">Treadmill: ${x.run||0} min · ${total} ingevulde sets</div>
     ${x.notes?`<p style="font-size:13px; margin:0 0 10px; color:var(--muted); font-style:italic">"${escapeHTML(x.notes)}"</p>`:""}
     <div style="font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.5">${exSummary}</div>
     <div class="actions">
       <button class="btn primary small" onclick="editTraining(${idx})">✏️ Bewerken</button>
       <button class="btn danger small" onclick="deleteTraining(${idx})">Verwijderen</button>
     </div>
   </div>`;
 });
}

function editTraining(idx){
 const h = loadHistory();
 const item = h[idx];
 if(!item) return;

 editingIndex = idx;
 switchTab(item.type);
 renderPlan(item.type);
 window.scrollTo({top: 0, behavior: 'smooth'});
}

function deleteTraining(i){
 openModal("Weet je zeker dat je deze training wilt verwijderen uit je historie?", () => {
   let h = loadHistory();
   if(editingIndex === i) editingIndex = null;
   else if(editingIndex > i) editingIndex--;
   h.splice(i,1);
   saveHistory(h);
   renderHistory();
 });
}

// ------------------- INSTELLINGEN & BACKUP TAB -------------------
function renderSettings(){
  const p = document.getElementById("settings");
  p.innerHTML = `
  <div class="toolbar">
    <h2 style="margin:0 0 10px">Instellingen & Back-ups</h2>
    
    <div class="card-box" style="margin-bottom:12px">
      <h3>Data Exporteren</h3>
      <p class="small">Exporteer je trainingsdata naar Excel of een overzichtelijk tekstbestand.</p>
      <div class="actions">
        <button class="btn primary" onclick="exportXLSX()">⬇ Excel (.xlsx)</button>
        <button class="btn" onclick="exportTXT()">⬇ Tekst (.txt)</button>
      </div>
    </div>

    <div class="card-box" style="margin-bottom:12px">
      <h3>Volledige Back-up & Herstel</h3>
      <p class="small">Download al je gegevens (inclusief schema's en bibliotheek) als JSON of laad een eerdere back-up in.</p>
      <div class="actions" style="margin-bottom:10px">
        <button class="btn primary" onclick="exportJSONBackup()">⬇ Reservekopie Maken (.json)</button>
      </div>
      <label>Back-up Bestand Inladen (.json)</label>
      <input type="file" id="import-file" class="input" accept=".json" onchange="importJSONBackup(event)">
    </div>

    <div class="card-box" style="border-color:rgba(227,109,109,0.3)">
      <h3 style="color:var(--danger)">Gevarenzone</h3>
      <p class="small">Wis alle opgeslagen geschiedenis en reset de applicatie naar de fabrijksinstellingen.</p>
      <button class="btn danger" onclick="clearAllData()">⚠️ Alle Gegevens Wissen</button>
    </div>
  </div>`;
}

function exportJSONBackup(){
  const data = {
    history: loadHistory(),
    library: getLibrary(),
    plans: getPlans()
  };
  download(`fitness-tracker-backup-${today()}.json`, JSON.stringify(data, null, 2), "application/json");
}

function importJSONBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if(data.history && data.library && data.plans){
        saveHistory(data.history);
        saveLibrary(data.library);
        savePlans(data.plans);
        alert("Back-up succesvol ingeladen!");
        location.reload();
      } else {
        alert("Ongeldig back-up bestand.");
      }
    } catch(err) {
      alert("Fout bij het lezen van het bestand: " + err.message);
    }
  };
  reader.readAsText(file);
}

function clearAllData(){
  openModal("Weet u HEEEL zeker dat u ALLE gegevens (historie, bibliotheek en instellingen) wilt wissen?", () => {
    localStorage.clear();
    location.reload();
  });
}

function exportRows(){
 const rows=[];
 loadHistory().forEach(t=>t.exercises.forEach(e=>(e.sets||[]).forEach(s=>rows.push({Datum:t.date,Schema:t.type,Treadmill_min:t.run,Oefening:e.name,Variant:e.variant||"-",Set:s.set,Gewicht_kg:s.kg,Herhalingen:s.reps,Reminder_Opmerking:e.extraNote||"",Notities:t.notes}))));
 return rows;
}
function exportXLSX(){const rows=exportRows();if(!rows.length){alert("Geen trainingsdata om te exporteren.");return}const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,"Trainingen");XLSX.writeFile(wb,"fitness-trainingen.xlsx")}
function exportTXT(){const h=loadHistory();if(!h.length){alert("Geen trainingsdata om te exporteren.");return}let s="FITNESS TRAININGEN\n==================\n\n";h.forEach(t=>{s+=`DATUM: ${t.date}\nSCHEMA: ${t.type}\nTREADMILL: ${t.run} min\n`;if(t.notes)s+=`NOTITIES: ${t.notes}\n`;t.exercises.forEach(e=>{if(e.sets && e.sets.length){let vText=e.variant?` [${e.variant}]`:"";s+=`\n${e.name}${vText}\n`;if(e.extraNote)s+=`  Reminder: ${e.extraNote}\n`;e.sets.forEach(x=>s+=`  Set ${x.set}: ${x.kg||"-"} kg · ${x.reps||"-"} reps\n`)}});s+="\n------------------\n"});download("fitness-trainingen.txt",s,"text/plain")}
function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function escapeHTML(s){return (s||"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

// Initial Render
renderPlan("A");
renderPlan("B");
renderPlan("CUSTOM");
</script>
